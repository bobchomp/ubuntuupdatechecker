# /etc/update-checker/config for "droplet"
# Public DigitalOcean droplet running Ubuntu + Docker.
# Outbound SMTP is blocked on DigitalOcean; email goes via the Resend HTTPS API.

[general]
label = droplet
recipient = you@example.com
from_address = info@rossmackenzie.co.uk
from_name = Update Checker
send_when_up_to_date = yes

[checks]
apt = yes
reboot = yes
snap = yes
pro = yes
unattended_upgrades = yes
disk = yes
pihole = no
apps = yes
docker = yes

[disk]
mount_points = /
# Droplet disks are small; warn a bit earlier
warn_percent = 75

[apps]
# Other software installed directly on this machine (not in Docker).
#   name = release source [| version command]
# "name" is the apt package name and/or the command on PATH. The installed
# version comes from dpkg, else from "NAME --version" / "NAME version", or
# from the command after "|" if given. Sources as in [docker.images]:
# github:OWNER/REPO or gitlab:GROUP/PROJECT.
# If the app comes from an apt repo (e.g. Tailscale's), apt updates are shown
# under System packages and not counted twice.
# tailscale = github:tailscale/tailscale
# cloudflared = github:cloudflare/cloudflared

[docker]
floating_tags =
ignore_containers =
digest_check_unmapped = no

[docker.images]
# Add one line per version-pinned image you run, for example:
# caddy = github:caddyserver/caddy
# traefik = github:traefik/traefik
# nginx = registry
# ghcr.io/umami-software/umami = github:umami-software/umami
# louislam/uptime-kuma = github:louislam/uptime-kuma

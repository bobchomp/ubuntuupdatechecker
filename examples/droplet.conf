# /etc/update-checker/config for "droplet"
# Public DigitalOcean droplet running Ubuntu + Docker.
# Outbound SMTP is blocked on DigitalOcean; email goes via the Resend HTTPS API.

[general]
label = droplet
recipient = you@example.com
from_address = info@rossmackenzie.co.uk
from_name = Update Checker
send_when_up_to_date = yes

[checks]
apt = yes
reboot = yes
snap = yes
pro = yes
unattended_upgrades = yes
disk = yes
pihole = no
apps = yes
docker = yes

[disk]
mount_points = /
# Droplet disks are small; warn a bit earlier
warn_percent = 75

[apps]
# Apps installed outside Docker. Nothing needs adding here: well-known apps
# (Tailscale, cloudflared, rclone, restic, caddy, netbird, node_exporter,
# lazydocker) are found and checked automatically, and any package apt can't
# update (installed from a downloaded .deb, or its repo was removed) is listed.
# To track something else:
#   name = github:OWNER/REPO        (or gitlab:GROUP/PROJECT)
#   name = github:OWNER/REPO | /path/to/program --version
#                                   (the command that prints its version,
#                                    if "name --version" doesn't work)
auto_detect = yes
# Names (apps or packages) to leave out of the report, comma-separated
ignore =

[docker]
floating_tags =
ignore_containers =
digest_check_unmapped = no

[docker.images]
# Add one line per version-pinned image you run, for example:
# caddy = github:caddyserver/caddy
# traefik = github:traefik/traefik
# nginx = registry
# ghcr.io/umami-software/umami = github:umami-software/umami
# louislam/uptime-kuma = github:louislam/uptime-kuma

# /etc/update-checker/config for "optiplex"
# Home server: CasaOS + many Docker containers, OS SSD on / and data HDD on /mnt/storage.

[general]
label = optiplex
recipient = you@example.com
from_address = info@rossmackenzie.co.uk
from_name = Update Checker
send_when_up_to_date = yes

[checks]
apt = yes
reboot = yes
snap = yes
pro = yes
unattended_upgrades = yes
disk = yes
pihole = no
apps = yes
docker = yes

[disk]
# If /mnt/storage is ever not mounted, the report flags it.
mount_points = /, /mnt/storage
warn_percent = 80

[apps]
# Apps installed outside Docker. Nothing needs adding here: well-known apps
# (Tailscale, cloudflared, rclone, restic, caddy, netbird, node_exporter,
# lazydocker) are found and checked automatically, and any package apt can't
# update (installed from a downloaded .deb, or its repo was removed) is listed.
# To track something else:
#   name = github:OWNER/REPO        (or gitlab:GROUP/PROJECT)
#   name = github:OWNER/REPO | /path/to/program --version
#                                   (the command that prints its version,
#                                    if "name --version" doesn't work)
auto_detect = yes
# Names (apps or packages) to leave out of the report, comma-separated
ignore =

[docker]
floating_tags =
ignore_containers =
digest_check_unmapped = no

[docker.images]
# Immich - server and ML share the GitHub release (e.g. v3.1.0)
ghcr.io/immich-app/immich-server = github:immich-app/immich
ghcr.io/immich-app/immich-machine-learning = github:immich-app/immich
# Immich's database/cache images use tags like "14-vectorchord0.4.3" or
# "8-bookworm" and are often pinned to an @sha256 digest by Immich's
# docker-compose.yml. "digest" reports when the registry has re-pushed that
# tag. If that's too noisy (you update them when Immich updates its compose
# file), delete these two lines and they'll show as "not checked" instead.
ghcr.io/immich-app/postgres = digest
docker.io/valkey/valkey = digest

# Crafty Controller 4 (e.g. 4.10.8) is released on GitLab
registry.gitlab.com/crafty-controller/crafty-4 = gitlab:crafty-controller/crafty-4
arcadiatechnology/crafty-4 = gitlab:crafty-controller/crafty-4

# More examples - uncomment / adapt to what `docker ps` shows:
# jellyfin/jellyfin = github:jellyfin/jellyfin
# portainer/portainer-ce = github:portainer/portainer
# vaultwarden/server = github:dani-garcia/vaultwarden

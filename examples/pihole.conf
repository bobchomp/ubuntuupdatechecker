# /etc/update-checker/config for "pihole"
# Dedicated Pi-hole box (Pi-hole installed directly on Ubuntu, no Docker).

[general]
label = pihole
recipient = you@example.com
from_address = info@rossmackenzie.co.uk
from_name = Update Checker
# Quiet box: only email when something needs attention
send_when_up_to_date = no

[checks]
apt = yes
reboot = yes
snap = yes
pro = yes
unattended_upgrades = yes
disk = yes
pihole = yes
docker = no

[disk]
mount_points = /
warn_percent = 80

# /etc/update-checker/config for "pihole"
# Dedicated Pi-hole box (Pi-hole installed directly on Ubuntu, no Docker).

[general]
label = pihole
recipient = you@example.com
from_address = info@rossmackenzie.co.uk
from_name = Update Checker
send_when_up_to_date = yes

[checks]
apt = yes
reboot = yes
snap = yes
pro = yes
unattended_upgrades = yes
disk = yes
pihole = yes
apps = yes
docker = no

[disk]
mount_points = /
warn_percent = 80

[apps]
# Apps installed outside Docker. Nothing needs adding here: well-known apps
# (Tailscale, cloudflared, rclone, restic, caddy, netbird, node_exporter,
# lazydocker) are found and checked automatically, and any package apt can't
# update (installed from a downloaded .deb, or its repo was removed) is listed.
# To track something else:
#   name = github:OWNER/REPO        (or gitlab:GROUP/PROJECT)
#   name = github:OWNER/REPO | /path/to/program --version
#                                   (the command that prints its version,
#                                    if "name --version" doesn't work)
auto_detect = yes
# Names (apps or packages) to leave out of the report, comma-separated
ignore =
